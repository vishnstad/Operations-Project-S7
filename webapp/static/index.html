<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crop-Area Allocation (LP)</title>
<meta name="description" content="Linear-programming crop-area allocation using district-level crop production data.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f7a4d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<script src="/vendor/plotly.min.js"></script>
</head>
<body>

<header class="top">
  <div class="title">
    <b>Optimal Crop-Area Allocation</b>
    <span class="muted">Linear Programming · Operations Research</span>
  </div>
  <span class="muted small" id="dataName"></span>
  <button class="btn hidden" id="newDataBtn">Load different data</button>
</header>

<nav class="tabs" id="tabs">
  <button data-page="home" class="on">1. Data</button>
  <button data-page="explore" disabled>2. Explore</button>
  <button data-page="crops" disabled>3. Crops</button>
  <button data-page="max" disabled>4. Maximise output</button>
  <button data-page="min" disabled>5. Minimise land</button>
  <button data-page="whatif" disabled>6. Sensitivity</button>
  <button data-page="districts" disabled>7. Districts</button>
  <button data-page="method">Model</button>
</nav>

<div class="scope hidden" id="scope">
  <label>State <select id="selState"></select></label>
  <label>Season <select id="selSeason"></select></label>
  <label>District <select id="selDistrict"></select></label>
  <label>Years <select id="selY0"></select> to <select id="selY1"></select></label>
</div>

<main id="view"></main>

<div class="toasts" id="toasts"></div>
<script src="/static/app.js"></script>
</body>
</html>
